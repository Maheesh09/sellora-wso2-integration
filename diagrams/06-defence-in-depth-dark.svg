<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420"><defs><marker id="m7d8590" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#7d8590" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" rx="0" fill="#0d1117"/><text x="40.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">Defence in depth: four checks on every request</text><text x="40.0" y="76.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Each layer answers a different question. A request reaches the data only if it passes all four.</text><rect x="40.0" y="112.0" width="318.0" height="236.0" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1"/><rect x="40" y="112" width="318" height="4" rx="2" fill="#d9824a"/><text x="60.0" y="146.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f0a46c" text-anchor="start" xml:space="preserve">1  WSO2 Identity Server</text><text x="60.0" y="178.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">Who are you?</text><circle cx="64" cy="216" r="2.5" fill="#9198a1"/><text x="76.0" y="221.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Password typed only on the IS page</text><circle cx="64" cy="246" r="2.5" fill="#9198a1"/><text x="76.0" y="251.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Code + PKCE, no browser secret</text><circle cx="64" cy="276" r="2.5" fill="#9198a1"/><text x="76.0" y="281.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Signed JWT, 1 hour</text><text x="60.0" y="320.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">No token, no API access</text><path d="M362,230 H376" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m7d8590)"/><rect x="380.0" y="112.0" width="318.0" height="236.0" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1"/><rect x="380" y="112" width="318" height="4" rx="2" fill="#4a8ee0"/><text x="400.0" y="146.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#7cb6ff" text-anchor="start" xml:space="preserve">2  WSO2 API Manager</text><text x="400.0" y="178.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">May this app call this API?</text><circle cx="404" cy="216" r="2.5" fill="#9198a1"/><text x="416.0" y="221.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">JWT signature + expiry (JWKS)</text><circle cx="404" cy="246" r="2.5" fill="#9198a1"/><text x="416.0" y="251.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">azp → subscribed application</text><circle cx="404" cy="276" r="2.5" fill="#9198a1"/><text x="416.0" y="281.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Rate-limit plan</text><text x="400.0" y="320.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Rejects with</text><rect x="484.0" y="305.0" width="40.3" height="22.0" rx="4" fill="#2b1517" stroke="#e5534b" stroke-width="1"/><text x="504.2" y="318.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff8e87" text-anchor="middle" xml:space="preserve">401</text><rect x="530.3" y="305.0" width="40.3" height="22.0" rx="4" fill="#2b1517" stroke="#e5534b" stroke-width="1"/><text x="550.5" y="318.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff8e87" text-anchor="middle" xml:space="preserve">403</text><rect x="576.6" y="305.0" width="40.3" height="22.0" rx="4" fill="#2b1517" stroke="#e5534b" stroke-width="1"/><text x="596.8" y="318.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff8e87" text-anchor="middle" xml:space="preserve">429</text><path d="M702,230 H716" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m7d8590)"/><rect x="720.0" y="112.0" width="318.0" height="236.0" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1"/><rect x="720" y="112" width="318" height="4" rx="2" fill="#3aa588"/><text x="740.0" y="146.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6fd1b5" text-anchor="start" xml:space="preserve">3  Sellora service</text><text x="740.0" y="178.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">May this user do this?</text><circle cx="744" cy="216" r="2.5" fill="#9198a1"/><text x="756.0" y="221.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">JWT checked again</text><circle cx="744" cy="246" r="2.5" fill="#9198a1"/><text x="756.0" y="251.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Role policy per endpoint</text><circle cx="744" cy="276" r="2.5" fill="#9198a1"/><text x="756.0" y="281.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Scope from /api/me/scope</text><text x="740.0" y="320.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Rejects with</text><rect x="824.0" y="305.0" width="40.3" height="22.0" rx="4" fill="#2b1517" stroke="#e5534b" stroke-width="1"/><text x="844.2" y="318.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff8e87" text-anchor="middle" xml:space="preserve">401</text><rect x="870.3" y="305.0" width="40.3" height="22.0" rx="4" fill="#2b1517" stroke="#e5534b" stroke-width="1"/><text x="890.5" y="318.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff8e87" text-anchor="middle" xml:space="preserve">403</text><rect x="916.6" y="305.0" width="40.3" height="22.0" rx="4" fill="#2b1517" stroke="#e5534b" stroke-width="1"/><text x="936.8" y="318.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff8e87" text-anchor="middle" xml:space="preserve">503</text><path d="M1042,230 H1056" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m7d8590)"/><rect x="1060.0" y="112.0" width="318.0" height="236.0" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1"/><rect x="1060" y="112" width="318" height="4" rx="2" fill="#9a7fd6"/><text x="1080.0" y="146.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#c3aaff" text-anchor="start" xml:space="preserve">4  Database</text><text x="1080.0" y="178.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">Which rows can they see?</text><circle cx="1084" cy="216" r="2.5" fill="#9198a1"/><text x="1096.0" y="221.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">EF Core tenant filter</text><circle cx="1084" cy="246" r="2.5" fill="#9198a1"/><text x="1096.0" y="251.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">company_id = token companyId</text><circle cx="1084" cy="276" r="2.5" fill="#9198a1"/><text x="1096.0" y="281.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">Never from body or URL</text><text x="1080.0" y="320.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Other companies' rows never return</text><text x="40.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Service-to-service calls skip layer 2, but the forwarded user JWT still passes layers 3 and 4.</text></svg>