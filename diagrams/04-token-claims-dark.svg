<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640"><defs></defs><rect width="100%" height="100%" rx="0" fill="#0d1117"/><text x="40.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">Access token: what each part is for</text><text x="40.0" y="76.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">A real token from WSO2 IS 7 (IDs shortened). Each row shows who reads that claim and what they do with it.</text><rect x="40.0" y="110.0" width="400.0" height="414.0" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1"/><text x="60.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">Access token payload (JWT)</text><text x="60.0" y="160.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">signed by IS · exp − iat = 3600 s (1 hour)</text><text x="60.0" y="194.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">{</text><text x="60.0" y="218.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "sub": "d8f8f8b7-…",</text><text x="60.0" y="242.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "roles": ["AgencyOperator",</text><text x="60.0" y="266.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">            "everyone"],</text><text x="60.0" y="290.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "companyId": "f62a41eb-…",</text><text x="60.0" y="314.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "iss": "https://&lt;is-host&gt;:9443/</text><text x="60.0" y="338.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">          oauth2/token",</text><text x="60.0" y="362.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "aud": "&lt;gateway-client-id&gt;",</text><text x="60.0" y="386.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "azp": "&lt;gateway-client-id&gt;",</text><text x="60.0" y="410.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">  "scope": "openid profile roles",</text><text x="60.0" y="434.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">  "org_handle": "carbon.super",</text><text x="60.0" y="458.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">  "iat": 1791317492,</text><text x="60.0" y="482.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">  "exp": 1791321092</text><text x="60.0" y="506.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">}</text><text x="494.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">Claim</text><text x="614.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">APIM gateway</text><text x="904.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">Sellora services</text><text x="1234.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">Web UI</text><path d="M480,142 H1430" fill="none" stroke="#30363d" stroke-width="1" stroke-linejoin="round"/><rect x="480.0" y="148.0" width="950.0" height="46.0" rx="4" fill="#151b23" stroke="none" stroke-width="0"/><text x="494.0" y="176.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">signature</text><circle cx="618" cy="172" r="3.5" fill="#4a8ee0"/><text x="630.0" y="176.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">verifies with IS JWKS keys</text><circle cx="908" cy="172" r="3.5" fill="#3aa588"/><text x="920.0" y="176.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">verifies with IS keys</text><text x="1234.0" y="176.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><text x="494.0" y="222.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">iss</text><circle cx="618" cy="218" r="3.5" fill="#4a8ee0"/><text x="630.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">selects key_manager_sellora</text><circle cx="908" cy="218" r="3.5" fill="#3aa588"/><text x="920.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">must be the IS issuer</text><text x="1234.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><rect x="480.0" y="240.0" width="950.0" height="46.0" rx="4" fill="#151b23" stroke="none" stroke-width="0"/><text x="494.0" y="268.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">azp</text><circle cx="618" cy="264" r="3.5" fill="#4a8ee0"/><text x="630.0" y="268.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">finds the subscribed app</text><text x="904.0" y="268.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><text x="1234.0" y="268.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><text x="494.0" y="314.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">aud</text><text x="614.0" y="314.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><circle cx="908" cy="310" r="3.5" fill="#3aa588"/><text x="920.0" y="314.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">must be the Gateway Client</text><text x="1234.0" y="314.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><rect x="480.0" y="332.0" width="950.0" height="46.0" rx="4" fill="#151b23" stroke="none" stroke-width="0"/><text x="494.0" y="360.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">exp</text><circle cx="618" cy="356" r="3.5" fill="#4a8ee0"/><text x="630.0" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">rejects expired tokens</text><circle cx="908" cy="356" r="3.5" fill="#3aa588"/><text x="920.0" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">rejects expired (30 s skew)</text><circle cx="1238" cy="356" r="3.5" fill="#8b98a9"/><text x="1250.0" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">renews 2 min before</text><text x="494.0" y="406.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">sub</text><text x="614.0" y="406.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><circle cx="908" cy="402" r="3.5" fill="#3aa588"/><text x="920.0" y="406.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">looks up scope (/api/me/scope)</text><text x="1234.0" y="406.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><rect x="480.0" y="424.0" width="950.0" height="46.0" rx="4" fill="#151b23" stroke="none" stroke-width="0"/><text x="494.0" y="452.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">roles</text><text x="614.0" y="452.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><circle cx="908" cy="448" r="3.5" fill="#3aa588"/><text x="920.0" y="452.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">endpoint role policies</text><circle cx="1238" cy="448" r="3.5" fill="#8b98a9"/><text x="1250.0" y="452.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">which pages to show</text><text x="494.0" y="498.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" xml:space="preserve">companyId</text><text x="614.0" y="498.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><circle cx="908" cy="494" r="3.5" fill="#3aa588"/><text x="920.0" y="498.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start" xml:space="preserve">tenant filter on every query</text><text x="1234.0" y="498.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5c6570" text-anchor="start" xml:space="preserve">—</text><text x="480.0" y="546.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">The token says who the user is. Where they sit (agency, rep, shop) comes from the Organization service.</text><text x="40.0" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start" xml:space="preserve">Key</text><circle cx="85" cy="596" r="4" fill="#4a8ee0"/><text x="96.0" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">checked by the APIM gateway</text><circle cx="308.6" cy="596" r="4" fill="#3aa588"/><text x="319.6" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">checked by each Sellora service</text><circle cx="559.4" cy="596" r="4" fill="#8b98a9"/><text x="570.4" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">used by the web UI (display only)</text><text x="828.8" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Greyed lines in the token are not used for decisions.</text></svg>