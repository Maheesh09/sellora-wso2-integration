eate whom</text><text x="722.0" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Company Admin → any staff role</text><text x="722.0" y="380.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Agency Operator → Sales Rep only</text><text x="722.0" y="400.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">companyId comes from the admin's token</text><path d="M722.0,482 H1007.0" fill="none" stroke="#1a7f64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m1a7f64)"/><circle cx="738.0" cy="446" r="10" fill="#ffffff" stroke="#1a7f64" stroke-width="1.5"/><text x="738.0" y="450.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#116149" text-anchor="middle" xml:space="preserve">3</text><text x="756.0" y="450.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Machine token (cached)</text><text x="756.0" y="470.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">POST /oauth2/token  grant_type=client_credentials</text><path d="M722.0,550 H1007.0" fill="none" stroke="#1a7f64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m1a7f64)"/><circle cx="738.0" cy="514" r="10" fill="#ffffff" stroke="#1a7f64" stroke-width="1.5"/><text x="738.0" y="518.2" font-family="-apple-system,BlinkM