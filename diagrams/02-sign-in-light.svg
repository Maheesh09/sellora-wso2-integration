<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="972" viewBox="0 0 1240 972"><defs><marker id="m59636e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#59636e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m818b98" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#818b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" rx="0" fill="#ffffff"/><text x="40.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1f2328" text-anchor="start" xml:space="preserve">Sign-in sequence: Authorization Code with PKCE</text><text x="40.0" y="76.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">The password only ever reaches WSO2 IS. The browser holds no client secret; PKCE proves the same app finishes the login.</text><path d="M140.0,170 V902" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="30.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#f3f5f7" stroke="#59636e" stroke-width="1.4"/><text x="140.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">User</text><text x="140.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#424a53" text-anchor="middle" xml:space="preserve">in a browser</text><path d="M620.0,170 V902" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="510.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#f3f5f7" stroke="#59636e" stroke-width="1.4"/><text x="620.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">Sellora web app</text><text x="620.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#424a53" text-anchor="middle" xml:space="preserve">React SPA</text><path d="M1100.0,170 V902" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="990.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#fff3eb" stroke="#c4581b" stroke-width="1.4"/><text x="1100.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">WSO2 Identity Server 7</text><text x="1100.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a4460f" text-anchor="middle" xml:space="preserve">Sellora Gateway Client</text><path d="M142.0,226 H617.0" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><circle cx="158.0" cy="210" r="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/><text x="158.0" y="214.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#424a53" text-anchor="middle" xml:space="preserve">1</text><text x="176.0" y="214.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Clicks Sign in</text><rect x="606.0" y="248.0" width="300.0" height="82.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="606.0" y="256.0" width="3" height="66.0" rx="1.5" fill="#59636e"/><text x="622.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#424a53" text-anchor="start" xml:space="preserve">PKCE</text><text x="622.0" y="292.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Makes a random code_verifier;</text><text x="622.0" y="312.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">sends only its SHA-256 hash</text><path d="M622.0,394 H1097.0" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><circle cx="638.0" cy="358" r="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/><text x="638.0" y="362.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#424a53" text-anchor="middle" xml:space="preserve">2</text><text x="656.0" y="362.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Redirects to the IS login page</text><text x="656.0" y="382.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">GET /oauth2/authorize  response_type=code, code_challenge</text><path d="M1098.0,442 H143.0" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><circle cx="158.0" cy="426" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/><text x="158.0" y="430.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle" xml:space="preserve">3</text><text x="176.0" y="430.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Shows the WSO2 IS login page</text><path d="M142.0,490 H1097.0" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><circle cx="158.0" cy="474" r="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/><text x="158.0" y="478.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#424a53" text-anchor="middle" xml:space="preserve">4</text><text x="176.0" y="478.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Enters username and password</text><path d="M1098.0,558 H623.0" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><circle cx="638.0" cy="522" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/><text x="638.0" y="526.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle" xml:space="preserve">5</text><text x="656.0" y="526.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Redirects back with a one-time code</text><text x="656.0" y="546.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">302 → test.selloralk.tech?code=…</text><path d="M622.0,626 H1097.0" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><circle cx="638.0" cy="590" r="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/><text x="638.0" y="594.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#424a53" text-anchor="middle" xml:space="preserve">6</text><text x="656.0" y="594.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Swaps the code for tokens</text><text x="656.0" y="614.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">POST /oauth2/token  code, code_verifier  (no client secret)</text><rect x="784.0" y="648.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="784.0" y="656.0" width="3" height="66.0" rx="1.5" fill="#c4581b"/><text x="800.0" y="672.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#a4460f" text-anchor="start" xml:space="preserve">Builds the access token</text><text x="800.0" y="692.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">roles  ← Organization-audience roles</text><text x="800.0" y="712.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">companyId  ← user attribute</text><path d="M1098.0,774 H623.0" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><circle cx="638.0" cy="758" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/><text x="638.0" y="762.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle" xml:space="preserve">7</text><text x="656.0" y="762.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Signed JWT (1 h) + refresh token</text><rect x="606.0" y="796.0" width="320.0" height="82.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="606.0" y="804.0" width="3" height="66.0" rx="1.5" fill="#59636e"/><text x="622.0" y="820.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#424a53" text-anchor="start" xml:space="preserve">Then</text><text x="622.0" y="840.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Token kept in memory only</text><text x="622.0" y="860.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Renewed silently 2 min before expiry</text><text x="40.0" y="936.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start" xml:space="preserve">Key</text><path d="M80,932 H114" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><text x="124.0" y="936.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">request</text><path d="M186.2,932 H220.2" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><text x="230.2" y="936.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">response / redirect</text><rect x="371.6" y="925.0" width="22.0" height="14.0" rx="3" fill="#fff3eb" stroke="#c4581b" stroke-width="1.2"/><text x="401.6" y="936.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">WSO2 IS</text></svg>