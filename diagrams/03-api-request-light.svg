<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1038" viewBox="0 0 1440 1038"><defs><marker id="m818b98" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#818b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1f6feb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1f6feb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1a7f64" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1a7f64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m59636e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#59636e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mcf222e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" rx="0" fill="#ffffff"/><text x="40.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1f2328" text-anchor="start" xml:space="preserve">Request sequence: one API call, end to end</text><text x="40.0" y="76.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">Three independent checks guard every call: the APIM gateway, the service itself, and the tenant filter on the data.</text><path d="M140.0,170 V942" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="30.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#f3f5f7" stroke="#59636e" stroke-width="1.4"/><text x="140.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">Sellora web app</text><text x="140.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#424a53" text-anchor="middle" xml:space="preserve">holds the JWT</text><path d="M430.0,170 V942" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="320.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="1.4"/><text x="430.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">WSO2 API Manager</text><text x="430.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0b57c2" text-anchor="middle" xml:space="preserve">gateway :8244</text><path d="M720.0,170 V942" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="610.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#eaf6f1" stroke="#1a7f64" stroke-width="1.4"/><text x="720.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">Order service</text><text x="720.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#116149" text-anchor="middle" xml:space="preserve">.NET 8</text><path d="M1010.0,170 V942" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="900.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#eaf6f1" stroke="#1a7f64" stroke-width="1.4"/><text x="1010.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">Organization service</text><text x="1010.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#116149" text-anchor="middle" xml:space="preserve">scope lookup</text><path d="M1300.0,170 V942" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="1190.0" y="108.0" width="220.0" height="62.0" rx="8" fill="#f4efff" stroke="#7c4fd6" stroke-width="1.4"/><text x="1300.0" y="135.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" xml:space="preserve">Order database</text><text x="1300.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6234b8" text-anchor="middle" xml:space="preserve">PostgreSQL</text><rect x="30.0" y="388.0" width="510.0" height="86.0" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="1" stroke-dasharray="5 4"/><text x="42.0" y="408.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a40e26" text-anchor="start" xml:space="preserve">Any gateway check fails: the service never sees the request</text><path d="M142.0,246 H427.0" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><circle cx="158.0" cy="210" r="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/><text x="158.0" y="214.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#424a53" text-anchor="middle" xml:space="preserve">1</text><text x="176.0" y="214.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">GET /sellora-order/1.0.0/api/orders</text><text x="176.0" y="234.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">Authorization: Bearer &lt;JWT&gt;</text><rect x="416.0" y="268.0" width="360.0" height="102.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="416.0" y="276.0" width="3" height="86.0" rx="1.5" fill="#1f6feb"/><text x="432.0" y="292.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0b57c2" text-anchor="start" xml:space="preserve">Gateway checks</text><text x="432.0" y="312.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Signature + expiry with IS keys (JWKS)</text><text x="432.0" y="332.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">azp → app “Sellora Gateway Client v2”</text><text x="432.0" y="352.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">App subscribed to this API? Within rate limit?</text><path d="M428.0,448 H143.0" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#mcf222e)"/><circle cx="158.0" cy="432" r="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/><text x="158.0" y="436.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#a40e26" text-anchor="middle" xml:space="preserve">2</text><text x="176.0" y="436.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">401 bad token · 403 not subscribed · 429 too many</text><path d="M432.0,514 H717.0" fill="none" stroke="#1f6feb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m1f6feb)"/><circle cx="448.0" cy="498" r="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="448.0" y="502.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0b57c2" text-anchor="middle" xml:space="preserve">3</text><text x="466.0" y="502.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Forwards the request, same JWT</text><rect x="706.0" y="536.0" width="340.0" height="102.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="706.0" y="544.0" width="3" height="86.0" rx="1.5" fill="#1a7f64"/><text x="722.0" y="560.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#116149" text-anchor="start" xml:space="preserve">Service checks the JWT again</text><text x="722.0" y="580.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Signature, issuer, audience, expiry</text><text x="722.0" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">roles → endpoint policy, else 403</text><text x="722.0" y="620.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">companyId → this request's tenant</text><path d="M722.0,702 H1007.0" fill="none" stroke="#1a7f64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m1a7f64)"/><circle cx="738.0" cy="666" r="10" fill="#ffffff" stroke="#1a7f64" stroke-width="1.5"/><text x="738.0" y="670.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#116149" text-anchor="middle" xml:space="preserve">4</text><text x="756.0" y="670.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Where does this user sit?</text><text x="756.0" y="690.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">GET /api/me/scope  (user's JWT, cached 5 min)</text><path d="M1008.0,750 H723.0" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><circle cx="738.0" cy="734" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/><text x="738.0" y="738.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle" xml:space="preserve">5</text><text x="756.0" y="738.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">rep, agency, shop, province IDs</text><path d="M722.0,818 H1297.0" fill="none" stroke="#1a7f64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m1a7f64)"/><circle cx="738.0" cy="782" r="10" fill="#ffffff" stroke="#1a7f64" stroke-width="1.5"/><text x="738.0" y="786.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#116149" text-anchor="middle" xml:space="preserve">6</text><text x="756.0" y="786.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">Query with tenant filter</text><text x="756.0" y="806.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">WHERE company_id = &lt;companyId from token&gt;</text><path d="M1298.0,866 H723.0" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><circle cx="738.0" cy="850" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/><text x="738.0" y="854.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle" xml:space="preserve">7</text><text x="756.0" y="854.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">This company's rows only</text><path d="M718.0,914 H143.0" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><circle cx="158.0" cy="898" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/><text x="158.0" y="902.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="middle" xml:space="preserve">8</text><text x="176.0" y="902.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" xml:space="preserve">200 OK (via the gateway)</text><text x="40.0" y="976.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start" xml:space="preserve">Key</text><path d="M80,972 H114" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m59636e)"/><text x="124.0" y="976.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">request</text><path d="M186.2,972 H220.2" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m818b98)"/><text x="230.2" y="976.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">response</text><path d="M299.0,972 H333.0" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#mcf222e)"/><text x="343.0" y="976.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">rejected</text><text x="40.0" y="1008.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">Service-to-service calls (e.g. Order → Inventory) skip APIM; the user's JWT is forwarded and checked again.</text></svg>